[project]
name = "find-jobs"
version = "0.1.0"
description = "Ranks open new-grad/early-career engineering roles from public Greenhouse, Ashby and Lever job-board APIs."
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# E501 is off because the scoring rationale lives in long prose comments that
# are more useful intact than rewrapped; line-length still applies to code.
select = ["E", "F", "W", "B", "C4", "UP"]
ignore = ["E501"]
